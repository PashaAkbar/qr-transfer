<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>QR Transfer File</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f4f6fb;--fg:#12182b;--mut:#5b6479;--card:#fff;--line:#d5dbea;--ac:#2b4cff;--acfg:#fff;--ok:#0a7a4b;--er:#b3261e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1424;--fg:#e8ecf8;--mut:#98a2bd;--card:#182038;--line:#2a3558;--ac:#7d93ff;--acfg:#0f1424;--ok:#5fd9a0;--er:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1424;--fg:#e8ecf8;--mut:#98a2bd;--card:#182038;--line:#2a3558;--ac:#7d93ff;--acfg:#0f1424;--ok:#5fd9a0;--er:#ff8a80;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:-.01em}
p.sub{margin:0 0 18px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
label{display:block;font-size:.9rem;color:var(--mut);margin:12px 0 4px}
input[type=file],select{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
.row{display:flex;gap:10px}.row>div{flex:1}
.btn{width:100%;margin-top:14px;border:0;border-radius:10px;background:var(--ac);color:var(--acfg);font:inherit;font-weight:600;padding:12px}
.btn.alt{background:none;color:var(--fg);border:1px solid var(--line)}
canvas#qr{display:block;width:min(100%,420px);aspect-ratio:1;margin:16px auto 0;image-rendering:pixelated;border-radius:8px;background:#fff}
.st{margin:12px 0 0;color:var(--mut);font-size:.95rem;word-break:break-word}
.st.ok{color:var(--ok)}.st.er{color:var(--er)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>QR Transfer File</h1>
  <p class="sub">Kirim file antar perangkat lewat QR yang berganti-ganti. Tanpa internet, tanpa server. Arahkan kamera aplikasi penerima ke layar ini.</p>

  <section class="card">
    <label for="file">File yang dikirim</label>
    <input type="file" id="file">
    <div class="row">
      <div><label for="sz">Isi per QR</label>
        <select id="sz"><option value="300">300 byte (mudah dibaca)</option><option value="600" selected>600 byte</option><option value="1000">1000 byte (cepat)</option></select></div>
      <div><label for="fps">Kecepatan</label>
        <select id="fps"><option value="2">2 QR/detik</option><option value="4" selected>4 QR/detik</option><option value="8">8 QR/detik</option></select></div>
    </div>
    <button class="btn" id="go">Mulai kirim</button>
    <button class="btn alt" id="stop" hidden>Hentikan</button>
    <canvas id="qr" width="10" height="10" hidden></canvas>
    <p class="st" id="sst">Pilih file, lalu arahkan kamera perangkat penerima ke layar ini.</p>
  </section>
</main>

<script>
/* Encoder QR: byte mode, error correction level L, versi dipilih otomatis. */
function qrMake(data){
  const EC=[7,10,15,20,26,18,20,24,30,18,20,24,26,30,22,24,28,30,28,28,28,28,30,30,26,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30];
  const NB=[1,1,1,1,1,2,2,2,2,4,4,4,4,4,6,6,6,6,7,8,8,9,9,10,12,12,12,13,14,15,16,17,18,19,19,20,21,22,24,25];
  const raw=v=>{let r=(16*v+128)*v+64;if(v>=2){const a=(v/7|0)+2;r-=(25*a-10)*a-55;if(v>=7)r-=36}return r};
  let ver=1;
  for(;;ver++){
    if(ver>40)throw new Error('Data terlalu besar');
    if(4+(ver<10?8:16)+8*data.length<=((raw(ver)>>3)-EC[ver-1]*NB[ver-1])*8)break;
  }
  const cap=((raw(ver)>>3)-EC[ver-1]*NB[ver-1])*8,bits=[];
  const put=(v,k)=>{for(let i=k-1;i>=0;i--)bits.push((v>>>i)&1)};
  put(4,4);put(data.length,ver<10?8:16);data.forEach(b=>put(b,8));
  put(0,Math.min(4,cap-bits.length));while(bits.length%8)bits.push(0);
  for(let p=0xEC;bits.length<cap;p^=0xEC^0x11)put(p,8);
  const cw=[];for(let i=0;i<bits.length;i+=8)cw.push(parseInt(bits.slice(i,i+8).join(''),2));
  const mul=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*285);z^=((y>>>i)&1)*x}return z};
  const nb=NB[ver-1],el=EC[ver-1],rc=raw(ver)>>3,ns=nb-rc%nb,sl=rc/nb|0;
  const div=Array(el).fill(0);div[el-1]=1;
  for(let i=0,r=1;i<el;i++){for(let j=0;j<el;j++){div[j]=mul(div[j],r);if(j+1<el)div[j]^=div[j+1]}r=mul(r,2)}
  const bl=[];
  for(let i=0,k=0;i<nb;i++){
    const d=cw.slice(k,k+sl-el+(i<ns?0:1));k+=d.length;
    const rem=Array(el).fill(0);
    for(const b of d){const f=b^rem.shift();rem.push(0);div.forEach((c,j)=>rem[j]^=mul(c,f))}
    if(i<ns)d.push(0);
    bl.push(d.concat(rem));
  }
  const all=[];
  for(let i=0;i<bl[0].length;i++)bl.forEach((b,j)=>{if(i!==sl-el||j>=ns)all.push(b[i])});
  const n=ver*4+17,m=[],fn=[];
  for(let i=0;i<n;i++){m.push(Array(n).fill(false));fn.push(Array(n).fill(false))}
  const set=(x,y,v)=>{m[y][x]=v;fn[y][x]=true};
  for(let i=0;i<n;i++){set(6,i,i%2===0);set(i,6,i%2===0)}
  const finder=(x,y)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const xx=x+dx,yy=y+dy;if(xx>=0&&xx<n&&yy>=0&&yy<n){const d=Math.max(Math.abs(dx),Math.abs(dy));set(xx,yy,d!==2&&d!==4)}}};
  finder(3,3);finder(n-4,3);finder(3,n-4);
  if(ver>1){
    const na=(ver/7|0)+2,st=ver===32?26:Math.ceil((ver*4+4)/(na*2-2))*2,pos=[6];
    for(let p=n-7;pos.length<na;p-=st)pos.splice(1,0,p);
    pos.forEach((x,i)=>pos.forEach((y,j)=>{
      if((i===0&&j===0)||(i===0&&j===na-1)||(i===na-1&&j===0))return;
      for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)set(x+dx,y+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1);
    }));
  }
  const fmt=mk=>{
    const d=(1<<3)|mk;let r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);
    const b=((d<<10)|r)^0x5412,g=i=>((b>>>i)&1)===1;
    for(let i=0;i<=5;i++)set(8,i,g(i));set(8,7,g(6));set(8,8,g(7));set(7,8,g(8));
    for(let i=9;i<15;i++)set(14-i,8,g(i));
    for(let i=0;i<8;i++)set(n-1-i,8,g(i));
    for(let i=8;i<15;i++)set(8,n-15+i,g(i));
    set(8,n-8,true);
  };
  fmt(0);
  if(ver>=7){
    let r=ver;for(let i=0;i<12;i++)r=(r<<1)^((r>>>11)*0x1F25);
    const b=(ver<<12)|r;
    for(let i=0;i<18;i++){const c=((b>>>i)&1)===1,a=n-11+i%3,q=i/3|0;set(a,q,c);set(q,a,c)}
  }
  for(let i=0,right=n-1;right>=1;right-=2){
    if(right===6)right=5;
    for(let vert=0;vert<n;vert++)for(let j=0;j<2;j++){
      const x=right-j,up=((right+1)&2)===0,y=up?n-1-vert:vert;
      if(!fn[y][x]&&i<all.length*8){m[y][x]=((all[i>>>3]>>>(7-(i&7)))&1)===1;i++}
    }
  }
  const MK=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,(x,y)=>((x/3|0)+(y/2|0))%2===0,(x,y)=>x*y%2+x*y%3===0,(x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
  const app=k=>{for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(!fn[y][x]&&MK[k](x,y))m[y][x]=!m[y][x]};
  const pen=()=>{
    let p=0,d=0;
    for(let a=0;a<n;a++)for(let t=0;t<2;t++){
      let run=1;
      for(let b=1;b<=n;b++){
        if(b<n&&(t?m[b][a]===m[b-1][a]:m[a][b]===m[a][b-1]))run++;
        else{if(run>=5)p+=run-2;run=1}
      }
    }
    for(let y=0;y<n;y++)for(let x=0;x<n;x++){
      if(m[y][x])d++;
      if(x<n-1&&y<n-1&&m[y][x]===m[y][x+1]&&m[y][x]===m[y+1][x]&&m[y][x]===m[y+1][x+1])p+=3;
    }
    return p+(Math.ceil(Math.abs(d*20-n*n*10)/(n*n))-1)*10;
  };
  let best=0,bp=1e9;
  for(let k=0;k<8;k++){fmt(k);app(k);const p=pen();if(p<bp){bp=p;best=k}app(k)}
  fmt(best);app(best);
  return{n,m};
}

const $=s=>document.querySelector(s);
const enc=new TextEncoder();
const CT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc=u=>{let c=-1;for(let i=0;i<u.length;i++)c=CT[(c^u[i])&255]^(c>>>8);return((c^-1)>>>0).toString(16)};
const b64=u=>{let s='';for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)};
const pipe=async(u,S,m)=>new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(new S(m))).arrayBuffer());
const say=(id,t,c)=>{const e=$(id);e.textContent=t;e.className='st'+(c?' '+c:'')};

let timer;
function draw(t){
  const {n,m}=qrMake(enc.encode(t)),c=$('#qr'),s=Math.max(2,Math.floor(560/(n+8)));
  c.width=c.height=s*(n+8);
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#000';
  for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(m[r][k])x.fillRect((k+4)*s,(r+4)*s,s,s);
}
$('#go').onclick=async()=>{
  const f=$('#file').files[0];
  if(!f)return say('#sst','Pilih file dulu.','er');
  clearInterval(timer);
  say('#sst','Menyiapkan...');
  const raw=new Uint8Array(await f.arrayBuffer());
  let data=raw,gz=0;
  if(window.CompressionStream){try{const z=await pipe(raw,CompressionStream,'gzip');if(z.length<raw.length){data=z;gz=1}}catch(e){}}
  const size=+$('#sz').value,n=Math.ceil(data.length/size),sid=Math.random().toString(36).slice(2,6);
  const meta=b64(enc.encode(JSON.stringify({n:f.name,s:raw.length,c:crc(raw),g:gz})));
  const frames=[`QF|${sid}|0|${n+1}|${meta}`];
  for(let i=0;i<n;i++)frames.push(`QF|${sid}|${i+1}|${n+1}|${b64(data.subarray(i*size,(i+1)*size))}`);
  let k=0;
  const show=()=>{draw(frames[k]);say('#sst',`QR ${k+1} dari ${frames.length}. Berulang otomatis sampai penerima selesai.`);k=(k+1)%frames.length};
  $('#qr').hidden=false;$('#stop').hidden=false;
  try{show()}catch(e){return say('#sst','Gagal: '+e.message,'er')}
  timer=setInterval(show,1000/+$('#fps').value);
};
$('#stop').onclick=()=>{clearInterval(timer);$('#qr').hidden=true;$('#stop').hidden=true;say('#sst','Pengiriman dihentikan.')};
</script>
</body>
</html>
